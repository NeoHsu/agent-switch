name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          version: 1.7.12
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Verify release tag matches package version
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          package_version="$(
            cargo metadata --no-deps --format-version 1 |
              python3 -c 'import json, sys; data = json.load(sys.stdin); print(next(package["version"] for package in data["packages"] if package["name"] == "agent-switch-cli"))'
          )"
          if [[ "$RELEASE_TAG" != "v$package_version" ]]; then
            echo "release tag $RELEASE_TAG does not match package version $package_version" >&2
            exit 1
          fi
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo install cargo-audit --locked --version 0.22.2
      - run: cargo audit --deny warnings

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            asset: linux-x86_64
          - os: macos-15
            target: aarch64-apple-darwin
            asset: macos-aarch64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            asset: macos-x86_64
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            asset: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Install musl linker
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - run: cargo build --release -p agent-switch-cli --target ${{ matrix.target }} --locked
      - name: Package Unix binary
        if: runner.os != 'Windows'
        run: tar -czf ags-${{ matrix.asset }}.tar.gz -C target/${{ matrix.target }}/release ags
      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target/${{ matrix.target }}/release/ags.exe -DestinationPath ags-${{ matrix.asset }}.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ags-${{ matrix.asset }}
          path: ags-${{ matrix.asset }}.*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ags-*
          merge-multiple: true
      - name: Generate SHA-256 checksums
        run: |
          sha256sum \
            ags-linux-x86_64.tar.gz \
            ags-macos-aarch64.tar.gz \
            ags-macos-x86_64.tar.gz \
            ags-windows-x86_64.zip \
            > SHA256SUMS
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            ags-linux-x86_64.tar.gz
            ags-macos-aarch64.tar.gz
            ags-macos-x86_64.tar.gz
            ags-windows-x86_64.zip
            SHA256SUMS
          fail_on_unmatched_files: true
          generate_release_notes: true
          preserve_order: true
